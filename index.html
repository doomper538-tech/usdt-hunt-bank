<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT HUNT BANK</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b1118;
            --card-bg: #101924;
            --accent-blue: #0088cc;
            --text-main: #ffffff;
            --text-muted: #6e7f91;
            --green: #00e676;
            --orange: #ff9100;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1a2635;
        }

        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-val {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .card-val span {
            font-size: 14px;
            color: var(--accent-blue);
        }

        .btn-invite {
            background-color: #162231;
            color: white;
            border: 1px solid #253549;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
        }

        .counters-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 0;
        }

        .counter-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .activity-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-online {
            color: var(--green);
            background: rgba(0, 230, 118, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        .section-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 10px 0;
        }

        .activity-log {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #1a2635;
        }

        .log-item {
            font-size: 13px;
            padding: 8px;
            background: #141f2d;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            animation: fadeIn 0.3s ease;
        }

        .log-user { color: #00c6ff; font-weight: 500; }
        .log-time { color: var(--text-muted); font-size: 11px; }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid #1a2635;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-blue); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏛️ ВАШ БАНК</h1>
        <div style="color: var(--accent-blue); font-size: 20px;">ℹ️</div>
    </div>

    <button class="btn-create">+ Создать банк</button>

    <div class="stats-grid">
        <div class="card">
            <div class="card-title">Ваши роялти</div>
            <div class="card-val">0 <span>TON</span></div>
        </div>
        <div class="card">
            <div class="card-title">Реферальный доход</div>
            <div class="card-val">0 <span>TON</span></div>
            <button class="btn-invite">👤+ Пригласить</button>
        </div>
    </div>

    <div class="counters-bar">
        <div class="counter-item" style="color: var(--green);">🟢 <span id="online-counter">105</span></div>
        <div class="counter-item" style="color: var(--orange);">🔥 <span id="burnt-counter">0</span></div>
    </div>

    <div class="activity-section">
        <div class="section-title">
            <span>Лента активности</span>
            <span class="status-online">● ОНЛАЙН</span>
        </div>
        <p class="section-desc">Действия в реальном времени, влияющие на ваш банк</p>

        <div class="activity-log" id="log-container">
            <!-- Сюда будут падать события захода юзеров -->
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">🏠<span>Главная</span></div>
        <div class="nav-item">🏆<span>Топ игроков</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const firstNames = ["Иван", "Алексей", "Дмитрий", "Ruslan", "Mikhail", "Артем", "Никита", "Ольга", "Анна"];
        const logContainer = document.getElementById('log-container');
        const onlineCounter = document.getElementById('online-counter');

        // Функция симуляции реальной активности
        function simulateActivity() {
            // Случайное изменение онлайна (+-3 человека)
            let currentOnline = parseInt(onlineCounter.innerText);
            currentOnline += Math.floor(Math.random() * 7) - 3;
            if(currentOnline < 10) currentOnline = 10;
            onlineCounter.innerText = currentOnline;

            // Добавление лога о зашедшем человеке
            const name = firstNames[Math.floor(Math.random() * firstNames.length)];
            const id = Math.floor(1000 + Math.random() * 9000);

            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <span>Пользователь <span class="log-user">${name}_${id}</span> зашел в приложение</span>
                <span class="log-time">только что</span>
            `;

            logContainer.insertBefore(logItem, logContainer.firstChild);

            // Держим в ленте не больше 3 записей, чтобы не забивать экран
            if (logContainer.children.length > 3) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // Запускаем симуляцию каждые 4 секунды
        setInterval(simulateActivity, 4000);
        simulateActivity();
    </script>
</body>
</html>
