<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT HUNT BANK</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b1118;
            --card-bg: #101924;
            --accent-blue: #0088cc;
            --text-main: #ffffff;
            --text-muted: #6e7f91;
            --green: #00e676;
            --orange: #ff9100;
            --red: #ff4a4a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .btn-action {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-deposit {
            background: linear-gradient(90deg, #00e676, #00b0ff);
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1a2635;
        }

        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-val {
            font-size: 22px;
            font-weight: bold;
        }

        .card-val span {
            font-size: 13px;
            color: var(--accent-blue);
        }

        .timer-card {
            background: rgba(255, 145, 0, 0.07);
            border: 1px solid rgba(255, 145, 0, 0.3);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            color: var(--orange);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .hidden {
            display: none !important;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid #1a2635;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏛️ USDT HUNT BANK</h1>
        <div style="color: var(--accent-blue); font-size: 20px; cursor: pointer;">ℹ️</div>
    </div>

    <!-- Стартовая кнопка создания банка -->
    <button id="btn-create-bank" class="btn-action">➕ Создать банк</button>

    <!-- Главная панель банка -->
    <div id="bank-dashboard" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Ваш баланс</div>
                <div id="user-balance" class="card-val">0.00 <span>USDT</span></div>
            </div>
            <div class="card">
                <div class="card-title">Статус</div>
                <div id="bank-status" style="color: var(--green); font-weight: bold; font-size: 18px; margin-top: 2px;">АКТИВЕН</div>
            </div>
        </div>

        <!-- Постоянный умный таймер -->
        <div id="burn-timer" class="timer-card" style="display: none;">
            ⏳ ДО СГОРАНИЯ: <span id="timer-time">24:00:00</span>
        </div>

        <button id="btn-deposit" class="btn-action btn-deposit">💰 Пополнить баланс</button>
    </div>

    <!-- Нижнее меню навигации -->
    <div class="nav-bar">
        <div class="nav-item active">🏠<span>Главная</span></div>
        <div class="nav-item">🏆<span>Топ игроков</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const btnCreate = document.getElementById('btn-create-bank');
        const bankDashboard = document.getElementById('bank-dashboard');
        const btnDeposit = document.getElementById('btn-deposit');
        const timerCard = document.getElementById('burn-timer');
        const timerTime = document.getElementById('timer-time');
        const userBalance = document.getElementById('user-balance');
        const bankStatus = document.getElementById('bank-status');

        let timerInterval = null;

        // Проверяем при входе, создавал ли пользователь банк ранее
        if (localStorage.getItem('bank_created') === 'true') {
            btnCreate.classList.add('hidden');
            bankDashboard.classList.remove('hidden');
            
            // Восстанавливаем баланс и таймер из памяти устройства
            const savedBalance = localStorage.getItem('bank_balance') || '0.00';
            userBalance.innerHTML = `${savedBalance} <span>USDT</span>`;
            
            const expireTime = localStorage.getItem('timer_expire_time');
            if (expireTime) {
                const secondsLeft = Math.floor((parseInt(expireTime) - Date.now()) / 1000);
                if (secondsLeft > 0) {
                    startBurnTimer(secondsLeft);
                } else {
                    setBankBurned();
                }
            }
        }

        // Действие: Создание банка
        btnCreate.addEventListener('click', () => {
            localStorage.setItem('bank_created', 'true');
            localStorage.setItem('bank_balance', '0.00');
            
            btnCreate.classList.add('hidden');
            bankDashboard.classList.remove('hidden');
            
            // Передаем сигнал твоему Python-боту
            tg.sendData(JSON.stringify({action: "create_bank"}));
        });

        // Действие: Запрос на пополнение баланса
        btnDeposit.addEventListener('click', () => {
            tg.sendData(JSON.stringify({action: "request_deposit"}));
            
            // Имитируем моментальное зачисление 10 USDT для теста графики
            const currentBal = parseFloat(localStorage.getItem('bank_balance') || '0.00') + 10.00;
            localStorage.setItem('bank_balance', currentBal.toFixed(2));
            userBalance.innerHTML = `${currentBal.toFixed(2)} <span>USDT</span>`;
            
            // Рассчитываем точное время сгорания (текущее время + 24 часа)
            const twentyFourHours = 24 * 60 * 60;
            const expireTimestamp = Date.now() + (twentyFourHours * 1000);
            localStorage.setItem('timer_expire_time', expireTimestamp.toString());
            
            // Перезапускаем статус в активный и включаем таймер
            bankStatus.innerText = "АКТИВЕН";
            bankStatus.style.color = "var(--green)";
            timerCard.style.background = "rgba(255, 145, 0, 0.07)";
            timerCard.style.borderColor = "rgba(255, 145, 0, 0.3)";
            timerCard.style.color = "var(--orange)";
            
            startBurnTimer(twentyFourHours);
        });

        // Логика работы живого таймера
        function startBurnTimer(durationInSeconds) {
            timerCard.style.display = "block";
            let timeRemaining = durationInSeconds;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    setBankBurned();
                    return;
                }

                timeRemaining--;
                
                let hours = Math.floor(timeRemaining / 3600);
                let minutes = Math.floor((timeRemaining % 3600) / 60);
                let seconds = timeRemaining % 60;

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerTime.innerText = `${hours}:${minutes}:${seconds}`;
            }, 1000);
        }

        // Функция срабатывания при обнулении банка
        function setBankBurned() {
            localStorage.setItem('bank_balance', '0.00');
            localStorage.removeItem('timer_expire_time');
            
            userBalance.innerHTML = "0.00 <span>USDT</span>";
            bankStatus.innerText = "СГОРЕЛ";
            bankStatus.style.color = "var(--red)";
            
            timerCard.style.display = "block";
            timerCard.innerHTML = "❌ ВРЕМЯ ИСТЕКЛО — БАНК ОБНУЛЕН";
            timerCard.style.background = "rgba(255, 74, 74, 0.08)";
            timerCard.style.borderColor = "rgba(255, 74, 74, 0.3)";
            timerCard.style.color = "var(--red)";
        }
    </script>
</body>
</html>
