<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT HUNT BANK</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b1118;
            --card-bg: #101924;
            --accent-blue: #0088cc;
            --text-main: #ffffff;
            --text-muted: #6e7f91;
            --green: #00e676;
            --orange: #ff9100;
            --red: #ff4a4a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; margin: 0; }
        
        .btn-action {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white; border: none; border-radius: 12px;
            padding: 14px; font-size: 16px; font-weight: bold;
            cursor: pointer; width: 100%; text-align: center;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
        .btn-deposit {
            background: linear-gradient(90deg, #00e676, #00b0ff);
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            margin-top: 10px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid #1a2635; }
        .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .card-val { font-size: 24px; font-weight: bold; }
        .card-val span { font-size: 14px; color: var(--accent-blue); }

        .timer-card {
            background: rgba(255, 145, 0, 0.1);
            border: 1px solid var(--orange);
            border-radius: 12px; padding: 12px;
            text-align: center; font-weight: bold;
            color: var(--orange); display: none;
        }

        .hidden { display: none !important; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--card-bg); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #1a2635; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); }
        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏛️ USDT HUNT BANK</h1>
        <div style="color: var(--accent-blue); font-size: 20px;">ℹ️</div>
    </div>

    <!-- Кнопка Создать Банк активна сразу -->
    <button id="btn-create-bank" class="btn-action">➕ Создать банк</button>

    <!-- Окно созданного банка -->
    <div id="bank-dashboard" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Ваш баланс</div>
                <div id="user-balance" class="card-val">0.00 <span>USDT</span></div>
            </div>
            <div class="card">
                <div class="card-title">Статус аккаунта</div>
                <div id="bank-status" style="color: var(--green); font-weight: bold; font-size: 18px; margin-top: 5px;">АКТИВЕН</div>
            </div>
        </div>

        <!-- Таймер сгорания на 24 часа -->
        <div id="burn-timer" class="timer-card">
            ⏳ ДО СГОРАНИЯ БАНКА: <span id="timer-time">24:00:00</span>
        </div>

        <button id="btn-deposit" class="btn-action btn-deposit">💰 Пополнить баланс</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">🏠<span>Главная</span></div>
        <div class="nav-item">🏆<span>Топ</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const btnCreate = document.getElementById('btn-create-bank');
        const bankDashboard = document.getElementById('bank-dashboard');
        const btnDeposit = document.getElementById('btn-deposit');
        const timerCard = document.getElementById('burn-timer');
        const timerTime = document.getElementById('timer-time');
        const userBalance = document.getElementById('user-balance');
        const bankStatus = document.getElementById('bank-status');

        let timerInterval = null;

        // Создание банка
        btnCreate.addEventListener('click', () => {
            btnCreate.classList.add('hidden');
            bankDashboard.classList.remove('hidden');
            tg.sendData(JSON.stringify({action: "create_bank"}));
        });

        // Запрос на пополнение счета
        btnDeposit.addEventListener('click', () => {
            tg.sendData(JSON.stringify({action: "request_deposit"}));
            
            // Тестовая демонстрация: сразу обновляем визуальный баланс и включаем таймер
            userBalance.innerHTML = "10.00 <span>USDT</span>";
            startBurnTimer(24 * 60 * 60);
        });

        function startBurnTimer(durationInSeconds) {
            timerCard.style.display = "block";
            let timeRemaining = durationInSeconds;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    userBalance.innerHTML = "0.00 <span>USDT</span>";
                    bankStatus.innerText = "СГОРЕЛ";
                    bankStatus.style.color = "var(--red)";
                    timerCard.innerHTML = "❌ БАНК ОБНУЛЕН";
                    timerCard.style.background = "rgba(255, 74, 74, 0.1)";
                    timerCard.style.borderColor = "var(--red)";
                    timerCard.style.color = "var(--red)";
                    return;
                }

                timeRemaining--;
                
                let hours = Math.floor(timeRemaining / 3600);
                let minutes = Math.floor((timeRemaining % 3600) / 60);
                let seconds = timeRemaining % 60;

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerTime.innerText = `${hours}:${minutes}:${seconds}`;
            }, 1000);
        }
    </script>
</body>
</html>
